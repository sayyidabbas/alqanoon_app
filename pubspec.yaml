name: law_platform
description: "تطبيق منصة القانون - تطبيق خاص بالأجهزة الذكية"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # حزمة دعم اللغة العربية واللغات الأخرى (RTL)
  flutter_localizations:
    sdk: flutter

  # حزمة الأيقونات الإضافية
  cupertino_icons: ^1.0.8

  # لحفظ الرمز السري وحالة تسجيل دخول البوابة الآمنة محلياً
  shared_preferences: ^2.2.2

  # لاختيار الصور من المعرض والكاميرا (مهمة لرفع غلاف الكتاب)
  image_picker: ^1.0.7

  # حزمة اختيار الملفات الرسمية والآمنة لملفات الـ PDF
  file_selector: ^1.0.3

  # 🌐 حزمة إرسال الطلبات لرفع الصور لسيرفر الرفع المجاني
  http: ^1.2.0

  # 🔗 حزمة فتح الروابط الخارجية (مهمة لفتح محادثات الواتساب والتليجرام في السوق)
  url_launcher: ^6.3.0

  # --- حزم الفايربيس للخدمات السحابية ---
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1

  # --- حزم رفع الملفات للسحابة ---
  supabase_flutter: ^2.5.0

  # ==========================================
  # الحزم الخاصة بالتحميل المباشر وفتح الملفات
  # ==========================================
  dio: ^5.5.0              # مسؤولة عن تنزيل الملفات باحترافية مع شريط تقدم
  path_provider: ^2.1.3    # للوصول إلى مسار التخزين الداخلي في الهاتف لحفظ الملف
  permission_handler: ^11.3.1 # لطلب صلاحيات التخزين من المستخدم بشكل آمن
  open_filex: ^4.4.0       # لفتح ملف الـ PDF مباشرة داخل الهاتف بعد اكتمال التحميل

  # ==========================================
  # الحزم الإضافية الموصى بها لتحسين واجهة السوق والتطبيق
  # ==========================================
  # لخطوط عربية احترافية وأكاديمية (مثل Cairo أو Tajawal) تناسب منصة القانون
  google_fonts: ^6.2.1
  
  # لعرض صور الكتب بكفاءة مع التخزين المؤقت (الكاش) لتقليل استهلاك الإنترنت وتسريع الظهور
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # حزمة تغيير اسم التطبيق المعتمدة
  rename: ^3.0.2

flutter:
  uses-material-design: true
