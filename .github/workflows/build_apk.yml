name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Recreate Android Folder
      run: flutter create . --platforms=android

    - name: Install Dependencies
      run: flutter pub get

    - name: Force compileSdk 36
      run: |
        sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle || true
        sed -i 's/compileSdk .*/compileSdk 36/g' android/app/build.gradle || true

    - name: Copy Firebase Config
      run: cp google-services.json android/app/ || true

    - name: Set App Name
      run: flutter pub run rename setAppName --targets android --value "منصة القانون" || true

    - name: Build APK
      run: flutter build apk --release --substitute-state-file-path=false
