name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Recreate Android Project Files
      run: flutter create . --platforms=android

    - name: Force compileSdk 36 globally
      run: |
        echo "
        subprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        compileSdk = 36
                        compileSdkVersion 36
                    }
                }
            }
        }
        " >> android/build.gradle

    - name: Install Dependencies
      run: flutter pub get

    - name: Copy Firebase Config
      run: cp google-services.json android/app/

    - name: Set App Name
      run: flutter pub run rename setAppName --targets android --value "منصة القانون"

    # تم إزالة || true لإظهار الخطأ الحقيقي إن وجد
    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: law-platform-apk
        path: build/app/outputs/flutter-apk/app-release.apk
