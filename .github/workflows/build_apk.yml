name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Recreate Android Folder
      run: flutter create . --platforms=android

    - name: Fix Gradle Version
      run: |
        GRADLE_PROP="android/gradle/wrapper/gradle-wrapper.properties"
        if [ -f "$GRADLE_PROP" ]; then
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip|g' "$GRADLE_PROP"
        fi

    - name: Install Dependencies
      run: flutter pub get

    - name: Set Android SDK Versions (Supports Android 7.0+)
      run: |
        # العودة إلى النسخة المستقرة (34)
        sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
        sed -i 's/compileSdk .*/compileSdk 34/g' android/app/build.gradle || true
        sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle || true
        sed -i 's/minSdk .*/minSdk 24/g' android/app/build.gradle || true
        
        sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle.kts || true
        sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts || true

    - name: Enable Core Library Desugaring
      run: |
        if [ -f "android/app/build.gradle" ]; then
          sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
          echo -e "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'\n}" >> android/app/build.gradle
        elif [ -f "android/app/build.gradle.kts" ]; then
          sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          echo -e "\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.3\")\n}" >> android/app/build.gradle.kts
        fi

    - name: Configure AndroidManifest for Notifications
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        # حقن صلاحيات الإشعارات والرنين قبل وسم <application
        sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />' $MANIFEST || true
        # حقن قناة فايربيس الافتراضية داخل وسم <application لكي يعمل والإشعار مغلق
        sed -i '/<activity/i \        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="high_importance_channel" />' $MANIFEST || true

    - name: Copy Firebase Config
      run: cp google-services.json android/app/ || true

    - name: Set App Name
      run: flutter pub run rename setAppName --targets android --value "منصة القانون" || true

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: law-platform-apk
        path: build/app/outputs/flutter-apk/app-release.apk
