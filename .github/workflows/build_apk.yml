name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    # إنشاء ملفات Android الحقيقية
    - name: Generate Android Project
      run: flutter create . --platforms=android --org com.lawplatform.app

    - name: Install Dependencies
      run: flutter pub get

    - name: Copy Firebase Config
      run: cp google-services.json android/app/

    # تعديل SDK إذا كان الملف موجود
    - name: Force SDK 36
      run: |
        if [ -f android/app/build.gradle ]; then
          sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' android/app/build.gradle
          sed -i 's/targetSdkVersion 34/targetSdkVersion 36/g' android/app/build.gradle
        fi

        if [ -f android/app/build.gradle.kts ]; then
          sed -i 's/compileSdk = 34/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = 34/targetSdk = 36/g' android/app/build.gradle.kts
        fi

    # تغيير اسم التطبيق بدون rename
    - name: Set App Name
      run: |
        sed -i 's/android:label="[^"]*"/android:label="منصة القانون"/' android/app/src/main/AndroidManifest.xml

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: law-platform-apk
        path: build/app/outputs/flutter-apk/*.apk
