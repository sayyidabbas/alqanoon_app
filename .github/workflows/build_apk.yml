name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get

    - name: Copy Firebase Config
      run: cp google-services.json android/app/

    - name: Force compileSdk 36 and targetSdk 36
      run: |
        BUILD_GRADLE="android/app/build.gradle"
        if [ -f "$BUILD_GRADLE" ]; then
          sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' "$BUILD_GRADLE"
          sed -i 's/compileSdk = 34/compileSdk = 36/g' "$BUILD_GRADLE"
          sed -i 's/targetSdkVersion 34/targetSdkVersion 36/g' "$BUILD_GRADLE"
          sed -i 's/targetSdk = 34/targetSdk = 36/g' "$BUILD_GRADLE"
        fi

    - name: Set App Name
      run: flutter pub run rename setAppName --targets android --value "منصة القانون"

    - name: Build APK
      run: flutter build apk --release

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: law-platform-apk
        path: |
          build/app/outputs/flutter-apk/*.apk
          build/app/outputs/apk/release/*.apk
