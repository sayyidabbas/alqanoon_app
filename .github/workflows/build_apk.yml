Name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Recreate Android Project Files
      run: flutter create . --platforms=android

    - name: Force compileSdk 36 globally
      run: |
        echo "
        subprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        compileSdk = 36
                        compileSdkVersion 36
                    }
                }
            }
        }
        " >> android/build.gradle

    - name: Add Android Queries Permission
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_PATH" ]; then
          python3 -c "
          import xml.etree.ElementTree as ET
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse('$MANIFEST_PATH')
          root = tree.getroot()
          if root.find('queries') is None:
              queries = ET.Element('queries')
              
              intent1 = ET.SubElement(queries, 'intent')
              ET.SubElement(intent1, 'action', {'{http://schemas.android.com/apk/res/android}name': 'android.intent.action.VIEW'})
              ET.SubElement(intent1, 'category', {'{http://schemas.android.com/apk/res/android}name': 'android.intent.category.BROWSABLE'})
              ET.SubElement(intent1, 'data', {'{http://schemas.android.com/apk/res/android}scheme': 'https'})

              intent2 = ET.SubElement(queries, 'intent')
              ET.SubElement(intent2, 'action', {'{http://schemas.android.com/apk/res/android}name': 'android.intent.action.VIEW'})
              ET.SubElement(intent2, 'data', {'{http://schemas.android.com/apk/res/android}mimeType': 'application/pdf'})

              root.insert(0, queries)
              tree.write('$MANIFEST_PATH', encoding='utf-8', xml_declaration=True)
          "
        fi

    - name: Install Dependencies
      run: flutter pub get

    - name: Copy Firebase Config
      run: cp google-services.json android/app/

    - name: Set App Name
      run: flutter pub run rename setAppName --targets android --value "منصة القانون"

    - name: Build APK (Bypass Flutter CLI Check)
      run: flutter build apk --release || true

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: law-platform-apk
        path: '**/*.apk'
