name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # تثبيت إصدار مستقر يمنع تعارضات AGP 9 و .kts
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'

    - name: Recreate Android Project Files
      run: flutter create . --platforms=android

    # ضبط إصدار الـ SDK إلى 34 بطريقة آمنة ومعتمدة
    - name: Configure Android SDK 34
      run: |
        echo "flutter.compileSdkVersion=34" >> android/local.properties
        echo "flutter.targetSdkVersion=34" >> android/local.properties
        echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties

    - name: Install Dependencies
      run: flutter pub get

    - name: Copy Firebase Config
      run: cp google-services.json android/app/

    - name: Set App Name
      run: flutter pub run rename setAppName --targets android --value "منصة القانون"

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: law-platform-apk
        path: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/apk/release/*.apk
