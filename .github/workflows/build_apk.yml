name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    # توليد مجلد أندرويد والملفات الأساسية المفقودة تلقائياً
    - name: Recreate Android Project Files
      run: flutter create . --platforms=android

    - name: Install Dependencies
      run: flutter pub get

    # نسخ ملف إعدادات الفايربيس إلى مجلد الأندرويد
    - name: Copy Firebase Config
      run: cp google-services.json android/app/

    # تطبيق اسم التطبيق "منصة القانون" عبر حزمة rename
    - name: Set App Name
      run: flutter pub run rename setAppName --value "منصة القانون"

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: law-platform-apk
        path: build/app/outputs/flutter-apk/app-release.apk
