name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Recreate Android Project Files
      run: flutter create . --platforms=android

    - name: Force compileSdk 36 globally
      run: |
        # فرض الإصدار 36 على كافة الحزم بصيغتي (compileSdk) و (compileSdkVersion) لتجنب أخطاء الإصدارات الجديدة
        echo "
        subprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        compileSdk = 36
                        compileSdkVersion 36
                    }
                }
            }
        }
        " >> android/build.gradle

    - name: Install Dependencies
      run: flutter pub get

    - name: Copy Firebase Config
      run: cp google-services.json android/app/

    - name: Set App Name
      run: flutter pub run rename setAppName --targets android --value "منصة القانون"

    - name: Build APK (Verbose Mode)
      # إضافة -v لطباعة تفاصيل البناء بدقة وكشف أي أخطاء صامتة
      run: flutter build apk --release -v

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: law-platform-apk
        # رفع مجلد المخرجات بالكامل لضمان التقاط ملف الـ APK أينما قام Gradle بحفظه
        path: build/app/outputs/
