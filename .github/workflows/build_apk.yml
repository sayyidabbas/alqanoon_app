name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Fix Android SDK Versions
      run: |
        # تحديث إصدار الـ compileSdk و targetSdk إلى 34 في ملف build.gradle لتوافق حزمة الـ PDF
        BUILD_GRADLE="android/app/build.gradle"
        if [ -f "$BUILD_GRADLE" ]; then
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' "$BUILD_GRADLE" || true
          sed -i 's/compileSdk =.*/compileSdk = 34/g' "$BUILD_GRADLE" || true
          sed -i 's/compileSdk .*/compileSdk 34/g' "$BUILD_GRADLE" || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' "$BUILD_GRADLE" || true
          sed -i 's/targetSdk =.*/targetSdk = 34/g' "$BUILD_GRADLE" || true
        fi

    - name: Install Dependencies
      run: flutter pub get

    - name: Copy Firebase Config
      run: cp google-services.json android/app/

    - name: Set App Name
      run: flutter pub run rename setAppName --targets android --value "منصة القانون"

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: law-platform-apk
        path: build/app/outputs/flutter-apk/app-release.apk
