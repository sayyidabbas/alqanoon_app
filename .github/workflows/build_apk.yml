name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get

    - name: Generate Android Structure Properly
      run: flutter create . --platforms=android --org com.lawplatform.app

    - name: Copy Firebase Config
      run: cp google-services.json android/app/

    - name: Set App Name
      run: flutter pub run rename setAppName --targets android --value "منصة القانون"

    - name: Build APK
      run: flutter build apk --release

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: law-platform-apk
        path: |
          build/app/outputs/flutter-apk/*.apk
          build/app/outputs/apk/release/*.apk
